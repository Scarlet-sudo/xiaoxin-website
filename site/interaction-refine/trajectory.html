职的方向，也重新思考自己真正想争取的机会。"]}, {"label": "Northstar", "title": "Northstar · 创造自己的产品", "body": ["也是在这段时间，我完成了自己的 AI 产品 Northstar。", "一边接触商业世界，一边尝试创造属于自己的东西。"]}, {"label": "JobRadar", "title": "JobRadar · 走进商业与增长", "body": ["机缘巧合下，我加入了一支早期 AI 创业团队，开始接触真实的业务增长、商务合作和平台运营。", "一边接触商业世界，一边尝试创造属于自己的东西。"]}, {"label": "现在", "title": "于是，我来到了这里。", "body": ["带着走过的路、做过的尝试、得到的经验，以及那些还没有答案的问题。", "我依然有很多想做的事情，也依然想寻找更多的可能性。"]}]</script><script src="/xiaoxin-website/site/trajectory-study/study.js?v=pages-1"></script><script src="/xiaoxin-website/site/reference-refine/motion-ip.js?v=pages-1"></script><script>new ResizeObserver(()=>parent.postMessage({type:"chapter-size",id:"why",height:document.documentElement.scrollHeight},location.origin)).observe(document.body);</script><script>addEventListener("message",e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==="close-chapter-detail")document.querySelector("dialog[open]")?.close();});</script><script src="/xiaoxin-website/site/interaction-refine/detail-chapters.js?v=pages-1"></script></body></html>
